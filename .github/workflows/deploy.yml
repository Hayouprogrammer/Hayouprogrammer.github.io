# Deploy to Cloudflare Pages
#
# Two ways to ship:
#   1. Git integration in the Cloudflare dashboard (recommended — no secrets here)
#   2. This workflow, which needs a CLOUDFLARE_API_TOKEN repo secret
#
# See DEPLOY.md.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hayelom-portfolio --branch=main
